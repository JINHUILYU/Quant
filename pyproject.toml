[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GoldQuant"
version = "0.1.0"
description = "Quantitative trading system for Chinese spot gold (Au99.99)"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jupyter>=1",
    "ipykernel>=6",
]
